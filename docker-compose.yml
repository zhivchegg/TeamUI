version: "3.8"

services:
  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: teamui-postgres
    environment:
      POSTGRES_DB: teamui
      POSTGRES_USER: teamui
      POSTGRES_PASSWORD: teamui
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamui -d teamui"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - teamui-net

  # TeamUI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamui-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/teamui
      SPRING_DATASOURCE_USERNAME: teamui
      SPRING_DATASOURCE_PASSWORD: teamui
      TEAMUI_JWT_SECRET: ${JWT_SECRET:-ChangeThisSecretInProduction32CharsMin}
      TEAMUI_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    networks:
      - teamui-net

volumes:
  postgres_data:

networks:
  teamui-net:
    driver: bridge
